{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>进入卡序问答库</h1>
  <p class="sub">输入你的用户名（和研发平台的一样，比如 h）。</p>
  {% if error %}<p class="notice">{{ error }}</p>{% endif %}
  <form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
    <input type="text" name="userid" autofocus required placeholder="用户名"><br><br>
    <button class="btn">进入</button></form>
</div>{% endblock %}
